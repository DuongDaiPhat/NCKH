project:
  anonymization_salt_env: ANONYMIZATION_SALT
  min_text_length: 3
  max_text_length: 10000
  vietnamese_only: true
  min_vietnamese_score: 0.12
  redact_mentions: true
  redact_urls: true
  redact_emails: true
  redact_phones: true
  store_permalinks: false
  pseudonymize_object_ids: true
  store_image_urls: false
  max_image_urls: 10
